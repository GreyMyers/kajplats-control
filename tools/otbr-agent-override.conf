# systemd drop-in for otbr-agent.
#
# Replaces the stock ExecStart with a wrapper that picks the backbone
# interface at start time instead of trusting a hardcoded name in
# /etc/default/otbr-agent. Also waits for the network to be up, so a boot-time
# start does not race the DHCP lease and find no default route.
#
# Install as /etc/systemd/system/otbr-agent.service.d/override.conf

[Unit]
Wants=network-online.target
After=network-online.target

[Service]
EnvironmentFile=-/etc/default/otbr-agent
ExecStart=
ExecStart=/usr/local/bin/otbr-start

# The wrapper exits non-zero when the RCP is unplugged or there is no route.
# Keep retrying rather than giving up, but slowly enough to stay readable in
# the journal.
Restart=on-failure
RestartSec=10
