[project]
name = "kajplats"
version = "0.1.0"
description = "Desktop colour control for IKEA KAJPLATS Matter bulbs"
readme = "README.md"
authors = [
    { name = "GreyMyers", email = "GreyEmyers@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyside6>=6.12.0",
    "websockets>=17.4",
]

[project.scripts]
kajplats = "kajplats.__main__:main"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyserial>=3.5",
]
